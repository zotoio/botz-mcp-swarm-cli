name: Publish CLI
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      diagnose:
        description: Check npm trusted publishing without publishing a package
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-cli
  cancel-in-progress: false
jobs:
  release-ref:
    if: ${{ !inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: release
        run: node scripts/check-release.mjs
  validate:
    needs: release-ref
    if: ${{ needs.release-ref.outputs.publish == 'true' }}
    uses: ./.github/workflows/ci.yml
  publish:
    needs: [release-ref, validate]
    if: ${{ needs.release-ref.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-package
          path: .artifacts
      # Publish the exact artifact that passed validation, without rebuilding it.
      - name: Publish validated CLI
        env:
          DIST_TAG: ${{ needs.release-ref.outputs.tag }}
        run: npm publish .artifacts/*.tgz --provenance --access public --tag "$DIST_TAG"
  diagnose:
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/diagnose-publisher.mjs
        env:
          NPM_PACKAGE: "@zotoio/botz-mcp-swarm-cli"
