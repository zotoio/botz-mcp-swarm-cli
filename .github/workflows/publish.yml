name: Publish CLI
# semantic-release: every push to main is analysed with Conventional Commits.
# fix: -> patch, feat: -> minor, "BREAKING CHANGE:" or "!" -> major; chore/docs/ci/test -> no release.
# PRs are squash-merged, so the PR title is the release commit.
# npm publishes via trusted publishing (OIDC, no token) with provenance. The npm trusted publisher
# points at this workflow file (publish.yml) and environment "release".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      diagnose:
        description: Check npm trusted publishing without publishing a package
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: publish-cli
  cancel-in-progress: false
jobs:
  validate:
    if: ${{ !inputs.diagnose }}
    uses: ./.github/workflows/ci.yml
  release:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Exact pin (no floating major in the id-token:write job); >= 11.5.1 is required for trusted publishing.
      - run: npm install -g npm@11.21.1
      - run: pnpm install --frozen-lockfile
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx --yes semantic-release@25.0.9
  diagnose:
    if: ${{ inputs.diagnose }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/diagnose-publisher.mjs
        env:
          NPM_PACKAGE: "@zotoio/botz-mcp-swarm-cli"
