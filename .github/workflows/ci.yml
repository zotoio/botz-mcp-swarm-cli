name: CI
# Cost controls (2026-10-23): push CI only on main; other branches run via their PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # macOS/Windows only on main or label full-os (2026-10-23, cost)
  # Also full on workflow_dispatch and release tags (publish calls this workflow).
  os-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          FULL_OS: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-os') }}
        run: |
          if [ "$FULL_OS" = "true" ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:leakage
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack --pack-destination .artifacts
      - run: node scripts/check-cli-pack.mjs --tarball .artifacts/*.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cli-package
          path: .artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true
  consumer:
    needs: [test, os-matrix]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS/Windows only on main or label full-os (2026-10-23, cost)
        os: ${{ fromJSON(needs.os-matrix.outputs.os) }}
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cli-package
          path: .artifacts
      - name: Test installed extension
        shell: bash
        run: node scripts/smoke-cli-package.mjs .artifacts/*.tgz
