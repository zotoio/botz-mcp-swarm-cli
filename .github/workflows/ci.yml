name: CI
# Cost controls (2026-10-23): push CI only on main; other branches run via their PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  # macOS/Windows only on main or label full-os (2026-10-23, cost)
  # Also full on workflow_dispatch and release tags (publish calls this workflow).
  os-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        env:
          FULL_OS: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))) || github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'full-os') }}
        run: |
          if [ "$FULL_OS" = "true" ]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm check:leakage
      - run: pnpm test
      - run: pnpm build
      - run: pnpm pack --pack-destination .artifacts
      - run: node scripts/check-cli-pack.mjs --tarball .artifacts/*.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cli-package
          path: .artifacts/*.tgz
          if-no-files-found: error
          include-hidden-files: true
  consumer:
    needs: [test, os-matrix]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macOS/Windows only on main or label full-os (2026-10-23, cost)
        os: ${{ fromJSON(needs.os-matrix.outputs.os) }}
        node: ['22.13.0', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: cli-package
          path: .artifacts
      - name: Test installed extension
        shell: bash
        run: node scripts/smoke-cli-package.mjs .artifacts/*.tgz

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint (download script pinned to v1.7.12 commit)
        shell: bash
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
